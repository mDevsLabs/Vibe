name: Build Mobile Apps (APK / IPA)

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: 'Build iOS (IPA) aussi — nécessite un runner macOS'
        type: boolean
        default: true
  push:
    tags:
      - 'mobile-v*'

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE: https://mai.val.run

      - name: Add Capacitor platforms
        run: |
          npm i -D @capacitor/cli
          npm i @capacitor/core @capacitor/android
          npx cap sync android || npx cap add android && npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build signed release APK (si keystore fourni)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=../release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          cd android && ./gradlew assembleRelease

      - name: Build debug APK (fallback sans keystore)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-android-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-ios:
    name: iOS IPA
    runs-on: macos-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ios || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE: https://mai.val.run

      - name: Add Capacitor iOS platform
        run: |
          npm i -D @capacitor/cli
          npm i @capacitor/core @capacitor/ios
          npx cap add ios
          npx cap sync ios

      - name: Build archive (non signé sans secrets Apple)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Export unsigned IPA
        run: |
          mkdir -p Payload
          cp -r ios/App/App.xcarchive/Products/Applications/*.app Payload/
          zip -r vibe-ios-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-ios-ipa
          path: vibe-ios-unsigned.ipa
          if-no-files-found: error
